# PR の自動レビュー（major182/_shared-workflows の claude-review を呼び出す。Secret: CLAUDE_CODE_OAUTH_TOKEN）
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    uses: major182/_shared-workflows/.github/workflows/claude-review.yml@v1.1.0
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    # with:
    #   extra_prompt: |
    #     - プロジェクト固有の観点
