# サーバーのイメージを作り、GitHub Container Registry（GHCR）に置く（デプロイ設計書 5.1）
# - 手で動かしたとき：ghcr.io/major182/meowscope-server:<コミット> を作って置く
# - PR でサーバーかこのファイルが変わったとき：置かずに、組み立てられることだけを確かめる
name: server-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - server/**
      - .github/workflows/server-image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: server
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: ghcr.io/major182/meowscope-server:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
