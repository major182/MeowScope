# PC の本番の Caddy のイメージを作り、GitHub Container Registry（GHCR）に置く（デプロイ設計書 2.4）
# - 手で動かしたとき：ghcr.io/major182/meowscope-caddy:<コミット> を作って置く
# - PR で deploy/caddy かこのファイルが変わったとき：置かずに、組み立てられることと部品が入っていることを確かめる
name: caddy-image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/caddy/**
      - .github/workflows/caddy-image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      # 確かめるために、まず手元（このジョブの中）に読み込む
      - uses: docker/build-push-action@v7.4.0
        with:
          context: deploy/caddy
          load: true
          tags: meowscope-caddy:check
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
      - name: Cloudflare の DNS の部品が入っていること
        run: docker run --rm meowscope-caddy:check caddy list-modules | grep -x dns.providers.cloudflare
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.4.0
        with:
          context: deploy/caddy
          push: true
          tags: ghcr.io/major182/meowscope-caddy:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=caddy
