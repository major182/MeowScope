# PR ごとに、手元の dart run tool/check.dart --all と同じチェックを GitHub 上でも動かす
# 変わった場所に関係するジョブだけを動かす（#282）。飛ばしたジョブは「成功」と数えるので、
# 必須のチェック（app・server）も止まらない。このファイルが変わったときは全部を動かす
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 脆弱性の検査は毎日も動かす。依存が変わらなくても、新しい脆弱性は毎日見つかるため（NF-SC-06）
  schedule:
    - cron: "0 18 * * *" # 日本時間の 3 時

permissions:
  contents: read

# 同じ PR に続けてプッシュしたら、古い実行を止める（最新の中身は必ず確かめる）。
# main へのプッシュは、マージごとの結果を残すために止めない
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # どこが変わったかを調べる。PR は GitHub の API で、main へのプッシュは前のコミットと比べる
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
      perf: ${{ steps.filter.outputs.perf }}
      deploy: ${{ steps.filter.outputs.deploy }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            app:
              - app/**
              - .github/workflows/ci.yml
            server:
              - server/**
              - .github/workflows/ci.yml
            perf:
              - perf/**
              - .github/workflows/ci.yml
            # バックアップの確認でサーバーを組み立てて動かすので、server/ も含める
            deploy:
              - deploy/**
              - compose.yaml
              - server/**
              - .github/workflows/ci.yml
            # 依存を足した・変えたときは、その PR の中で脆弱性を調べる
            deps:
              - app/pubspec.lock
              - server/gradle.lockfile
              - perf/package-lock.json
              - .github/workflows/ci.yml

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      # Android の Kotlin の単体テスト（./gradlew）で、Gradle と依存の取っておいた分を使う
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get
      - run: dart run tool/check.dart

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check

  # 性能テストのスクリプトの型チェック。性能テストそのものは手元で任意のときに動かす（性能テスト設計書 6章）
  perf:
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck

  # 依存ライブラリの脆弱性を検査する（NF-SC-06）。見つかったら失敗する。依存が変わったときと、毎日1回動かす
  vulnerability:
    needs: changes
    # 毎日の実行では changes を飛ばすので、!cancelled() で飛ばされた changes を待たずに動かす
    if: ${{ !cancelled() && (github.event_name == 'schedule' || needs.changes.outputs.deps == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=app/pubspec.lock
            --lockfile=server/gradle.lockfile
            --lockfile=perf/package-lock.json

  # デプロイの定義の確認（デプロイ設計書）。AWS にはつながない
  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.5
      - name: terraform fmt と validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: compose の設定（AWS 用の差分を重ねる）
        env:
          DB_PASSWORD: dummy
          JWT_SECRET: dummy
          SERVER_IMAGE_TAG: dummy
          SITE_ADDRESS: 192-0-2-1.sslip.io
        run: |
          docker compose -f compose.yaml -f deploy/compose.aws.yaml config --quiet
          # 外に出すのは Caddy の 80・443 だけ
          test "$(docker compose -f compose.yaml -f deploy/compose.aws.yaml config --format json | jq -c '[.services[] | .ports[]?.published] | sort')" = '["443","443","80"]'
          # 本番の名前は meowscope（開発用の meowscope-dev と分ける。デプロイ設計書 6.3）
          test "$(docker compose -f compose.yaml -f deploy/compose.aws.yaml config --format json | jq -r .name)" = meowscope
          test "$(docker compose config --format json | jq -r .name)" = meowscope-dev
      - name: compose の設定（PC 用の差分を重ねる）
        env:
          DB_PASSWORD: dummy
          JWT_SECRET: dummy
          SERVER_IMAGE_TAG: dummy
          CADDY_IMAGE_TAG: dummy
          CLOUDFLARE_API_TOKEN: dummy
          # tailnet の IP の見本（CGNAT の範囲の、使われていない番号）
          TAILSCALE_IP: 100.64.0.1
        run: |
          docker compose -f compose.yaml -f deploy/compose.pc.yaml config --quiet
          # 名前は本番の meowscope。受けるのは、Caddy の tailnet の IP の 18443（切り替えの前。デプロイ設計書 5.7）と、
          # PC の中（127.0.0.1）の 18080 だけで、DB は出さない
          test "$(docker compose -f compose.yaml -f deploy/compose.pc.yaml config --format json | jq -r .name)" = meowscope
          test "$(docker compose -f compose.yaml -f deploy/compose.pc.yaml config --format json | jq -c '[.services[] | .ports[]? | "\(.host_ip):\(.published)"]')" = '["100.64.0.1:18443","127.0.0.1:18080"]'
      - name: シェルスクリプトの静的チェック
        # -x：source で読む deploy/lib の関数も合わせて調べる
        run: shellcheck -x deploy/*.sh deploy/lib/*.sh deploy/tests/*.sh
      - name: シェルスクリプトの単体テスト（.env の読み方）
        run: bash deploy/tests/env_test.sh
      - name: バックアップと復元の確認（開発用の compose で動かす）
        run: |
          {
            echo DB_PASSWORD=ci-password
            echo "JWT_SECRET=$(openssl rand -base64 32)"
          } > .env
          docker compose up -d --build --wait
          # サーバーが起動し、Flyway が表を作るまで待つ
          timeout 120 bash -c "until curl -fs localhost:8080/actuator/health; do sleep 2; done"
          deploy/backup.sh "$RUNNER_TEMP/backup"
          deploy/restore-check.sh "$RUNNER_TEMP/backup"
