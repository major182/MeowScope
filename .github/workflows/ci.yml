# PR ごとに、手元の dart run tool/check.dart --all と同じチェックを GitHub 上でも動かす
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart run tool/check.dart

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check

  # 性能テストのスクリプトの型チェック。性能テストそのものは手元で任意のときに動かす（性能テスト設計書 6章）
  perf:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: perf
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck

  # 依存ライブラリの脆弱性を検査する（NF-SC-06）。見つかったら失敗する
  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=app/pubspec.lock
            --lockfile=server/gradle.lockfile
            --lockfile=perf/package-lock.json

  # デプロイの定義の確認（デプロイ設計書）。AWS にはつながない
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.5
      - name: terraform fmt と validate
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: compose の設定（AWS 用の差分を重ねる）
        env:
          DB_PASSWORD: dummy
          JWT_SECRET: dummy
          SERVER_IMAGE_TAG: dummy
          SITE_ADDRESS: 192-0-2-1.sslip.io
        run: |
          docker compose -f compose.yaml -f deploy/compose.aws.yaml config --quiet
          # 外に出すのは Caddy の 80・443 だけ
          test "$(docker compose -f compose.yaml -f deploy/compose.aws.yaml config --format json | jq -c '[.services[] | .ports[]?.published] | sort')" = '["443","443","80"]'
          # 本番の名前は meowscope（開発用の meowscope-dev と分ける。デプロイ設計書 6.3）
          test "$(docker compose -f compose.yaml -f deploy/compose.aws.yaml config --format json | jq -r .name)" = meowscope
          test "$(docker compose config --format json | jq -r .name)" = meowscope-dev
      - name: compose の設定（PC 用の差分を重ねる）
        env:
          DB_PASSWORD: dummy
          JWT_SECRET: dummy
          SERVER_IMAGE_TAG: dummy
        run: |
          docker compose -f compose.yaml -f deploy/compose.pc.yaml config --quiet
          # 名前は本番の meowscope。受けるのは PC の中（127.0.0.1）の 18080 だけで、DB は出さない
          test "$(docker compose -f compose.yaml -f deploy/compose.pc.yaml config --format json | jq -r .name)" = meowscope
          test "$(docker compose -f compose.yaml -f deploy/compose.pc.yaml config --format json | jq -c '[.services[] | .ports[]? | "\(.host_ip):\(.published)"]')" = '["127.0.0.1:18080"]'
      - name: シェルスクリプトの静的チェック
        run: shellcheck deploy/*.sh
      - name: バックアップと復元の確認（開発用の compose で動かす）
        run: |
          {
            echo DB_PASSWORD=ci-password
            echo "JWT_SECRET=$(openssl rand -base64 32)"
          } > .env
          docker compose up -d --build --wait
          # サーバーが起動し、Flyway が表を作るまで待つ
          timeout 120 bash -c "until curl -fs localhost:8080/actuator/health; do sleep 2; done"
          deploy/backup.sh "$RUNNER_TEMP/backup"
          deploy/restore-check.sh "$RUNNER_TEMP/backup"
