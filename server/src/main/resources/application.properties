# サーバーの設定。秘密の値はここに書かず、環境変数で渡す（CLAUDE.md 4.2、.env.example）
spring.application.name=meowscope-server

# ログに出す環境と版（ログ設計書 2章の env・version）。Compose から環境変数で上書きする
meowscope.env=${MEOWSCOPE_ENV:local}
meowscope.version=${MEOWSCOPE_VERSION:dev}

# DB。パスワードは既定値を持たせず、渡し忘れたら起動しないようにする
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/meowscope}
spring.datasource.username=${DB_USER:meowscope}
spring.datasource.password=${DB_PASSWORD}

# 1件1行の JSON で標準出力に出す（ログ設計書 1章）。開発では application-dev.properties で人が読む形に戻す
logging.structured.format.console=com.meowscope.server.common.logging.JsonLogFormatter

# エラーを RFC 9457 の形で返す（API 設計書 9章）
spring.mvc.problemdetails.enabled=true

# 死活監視だけを公開する。詳しい情報は外に出さない
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
